<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1215" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif"><defs><marker id="pt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B2A41"/></marker><marker id="pve" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8E5A"/></marker><marker id="pro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="pam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B7791F"/></marker><marker id="paz" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker><marker id="pmo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B4FA8"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="40" y="50" font-size="32" font-weight="800" fill="#1B2A41" text-anchor="start">Pipeline MLOps / GitOps de la Capa Nube del Agente OS</text><text x="40" y="84" font-size="18" font-weight="400" fill="#5B6B7F" text-anchor="start">Cada cambio de código, datos o parámetros recorre el mismo camino; nada llega a producción sin pasar sus compuertas.</text><rect x="40" y="115" width="380" height="470" rx="16" fill="#EAF2FB" stroke="#2F6DB5" stroke-width="2.2"/><text x="58" y="147" font-size="21" font-weight="700" fill="#2F6DB5">1 · Código y datos (Git + DVC)</text><text x="58" y="171" font-size="15.5" fill="#5B6B7F">fuente de verdad versionada</text><rect x="60" y="190" width="340" height="64" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="74" y="217" font-size="17.5" font-weight="700" fill="#1B2A41">src/ · pipelines/ · tests/</text><text x="74" y="240" font-size="15" fill="#5B6B7F">código del servicio y del pipeline</text><rect x="60" y="266" width="340" height="64" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="74" y="293" font-size="17.5" font-weight="700" fill="#1B2A41">params.yaml</text><text x="74" y="316" font-size="15" fill="#5B6B7F">hiperparámetros y umbrales de compuerta</text><rect x="60" y="342" width="340" height="64" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="74" y="369" font-size="17.5" font-weight="700" fill="#1B2A41">data/evaluacion/</text><text x="74" y="392" font-size="15" fill="#5B6B7F">conjuntos por grupo: A9, F3, F4 (ciego)</text><rect x="60" y="418" width="340" height="64" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="74" y="445" font-size="17.5" font-weight="700" fill="#1B2A41">dvc.yaml · dvc.lock</text><text x="74" y="468" font-size="15" fill="#5B6B7F">etapas y hash de cada artefacto</text><rect x="60" y="494" width="340" height="64" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="74" y="521" font-size="17.5" font-weight="700" fill="#1B2A41">docs/adr/ · docs/bitacora.md</text><text x="74" y="544" font-size="15" fill="#5B6B7F">decisiones y registro del trabajo</text><rect x="470" y="115" width="1020" height="470" rx="16" fill="#E8F6EE" stroke="#1E8E5A" stroke-width="2.2"/><text x="488" y="147" font-size="21" font-weight="700" fill="#1E8E5A">2 · Integración continua (GitHub Actions · ci.yml)</text><text x="488" y="171" font-size="15.5" fill="#5B6B7F">se ejecuta en cada pull request y en main</text><rect x="490" y="190" width="150" height="82" rx="9" fill="#fff" stroke="#1E8E5A" stroke-width="2"/><text x="565.0" y="217" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">Lint</text><text x="565.0" y="240" font-size="15" fill="#5B6B7F" text-anchor="middle">ruff</text><rect x="654" y="190" width="150" height="82" rx="9" fill="#fff" stroke="#1E8E5A" stroke-width="2"/><text x="729.0" y="217" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">Pruebas</text><text x="729.0" y="240" font-size="15" fill="#5B6B7F" text-anchor="middle">unitarias y de datos</text><polyline points="640,231 654,231" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="818" y="190" width="150" height="82" rx="9" fill="#fff" stroke="#1E8E5A" stroke-width="2"/><text x="893.0" y="217" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">dvc repro</text><text x="893.0" y="240" font-size="15" fill="#5B6B7F" text-anchor="middle">5 etapas</text><polyline points="804,231 818,231" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="982" y="190" width="150" height="82" rx="9" fill="#fff" stroke="#1E8E5A" stroke-width="2"/><text x="1057.0" y="217" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">Pruebas</text><text x="1057.0" y="240" font-size="15" fill="#5B6B7F" text-anchor="middle">modelo y API</text><polyline points="968,231 982,231" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="1146" y="190" width="150" height="82" rx="9" fill="#fff" stroke="#1E8E5A" stroke-width="2"/><text x="1221.0" y="217" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">MLflow</text><text x="1221.0" y="240" font-size="15" fill="#5B6B7F" text-anchor="middle">registro</text><polyline points="1132,231 1146,231" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="1310" y="190" width="150" height="82" rx="9" fill="#fff" stroke="#1E8E5A" stroke-width="2"/><text x="1385.0" y="217" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">Imagen</text><text x="1385.0" y="240" font-size="15" fill="#5B6B7F" text-anchor="middle">Docker + humo</text><polyline points="1296,231 1310,231" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="490" y="300" width="980" height="270" rx="9" fill="#fff" stroke="#1E8E5A" stroke-width="2"/><text x="504" y="327" font-size="17.5" font-weight="700" fill="#1B2A41">Etapas de dvc repro</text><rect x="510" y="345" width="178" height="92" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="599.0" y="372" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">preparar_datos</text><text x="599.0" y="395" font-size="15" fill="#5B6B7F" text-anchor="middle">corpus sintéticos</text><text x="599.0" y="416" font-size="15" fill="#5B6B7F" text-anchor="middle">versionados</text><rect x="702" y="345" width="178" height="92" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="791.0" y="372" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">validar_datos</text><text x="791.0" y="395" font-size="15" fill="#5B6B7F" text-anchor="middle">contratos, duplicados,</text><text x="791.0" y="416" font-size="15" fill="#5B6B7F" text-anchor="middle">fuga, sin PII</text><polyline points="688,391 702,391" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="894" y="345" width="178" height="92" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="983.0" y="372" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">entrenar</text><text x="983.0" y="395" font-size="15" fill="#5B6B7F" text-anchor="middle">riesgo + inyección,</text><text x="983.0" y="416" font-size="15" fill="#5B6B7F" text-anchor="middle">calibración en dev</text><polyline points="880,391 894,391" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="1086" y="345" width="178" height="92" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="1175.0" y="372" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">evaluar</text><text x="1175.0" y="395" font-size="15" fill="#5B6B7F" text-anchor="middle">TPR, FPR e impacto</text><text x="1175.0" y="416" font-size="15" fill="#5B6B7F" text-anchor="middle">dispar por grupo</text><polyline points="1072,391 1086,391" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="1278" y="345" width="178" height="92" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="1367.0" y="372" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">compuerta</text><text x="1367.0" y="395" font-size="15" fill="#5B6B7F" text-anchor="middle">umbrales + no regresión</text><text x="1367.0" y="416" font-size="15" fill="#5B6B7F" text-anchor="middle">→ modo por componente</text><polyline points="1264,391 1278,391" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><text x="510" y="475" font-size="16" font-weight="700" fill="#1E8E5A" text-anchor="start">Salida: models/release.json →  riesgo: aplicar · inyección: sombra · PII: aplicar</text><text x="510" y="503" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start">Si un componente falla, nunca se aplica: queda en sombra o se mantiene el campeón. Los umbrales no se relajan.</text><text x="510" y="531" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="start">Primera corrida: la validación detectó 210 duplicados y desbalance 82/18; la compuerta rechazó v3.0 y v3.1 (inyección).</text><rect x="1540" y="115" width="820" height="470" rx="16" fill="#F3EEFB" stroke="#6B4FA8" stroke-width="2.2"/><text x="1558" y="147" font-size="21" font-weight="700" fill="#6B4FA8">3 · Registro y artefactos</text><text x="1558" y="171" font-size="15.5" fill="#5B6B7F">linaje reproducible</text><rect x="1560" y="190" width="780" height="82" rx="9" fill="#fff" stroke="#6B4FA8" stroke-width="2"/><text x="1574" y="217" font-size="17.5" font-weight="700" fill="#1B2A41">MLflow Tracking</text><text x="1574" y="240" font-size="15" fill="#5B6B7F">parámetros, métricas por grupo, reportes, hashes</text><rect x="1560" y="286" width="780" height="82" rx="9" fill="#fff" stroke="#6B4FA8" stroke-width="2"/><text x="1574" y="313" font-size="17.5" font-weight="700" fill="#1B2A41">MLflow Model Registry</text><text x="1574" y="336" font-size="15" fill="#5B6B7F">alias: candidato → campeon · sombra</text><text x="1574" y="357" font-size="15" fill="#5B6B7F">tags: compuerta, modo, versión</text><rect x="1560" y="382" width="780" height="82" rx="9" fill="#fff" stroke="#6B4FA8" stroke-width="2"/><text x="1574" y="409" font-size="17.5" font-weight="700" fill="#1B2A41">Tarjeta de modelo</text><text x="1574" y="432" font-size="15" fill="#5B6B7F">propósito, datos, evaluación, límites</text><rect x="1560" y="478" width="780" height="82" rx="9" fill="#fff" stroke="#6B4FA8" stroke-width="2"/><text x="1574" y="505" font-size="17.5" font-weight="700" fill="#1B2A41">Imagen ghcr.io/…/agente-os-cloud:&lt;sha&gt;</text><text x="1574" y="528" font-size="15" fill="#5B6B7F">incluye los modelos aprobados</text><polyline points="1490,430 1540,430" fill="none" stroke="#1E8E5A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pve)"/><rect x="40" y="630" width="1450" height="500" rx="16" fill="#FFF8E6" stroke="#B7791F" stroke-width="2.2"/><text x="58" y="662" font-size="21" font-weight="700" fill="#B7791F">4 · Despliegue continuo GitOps (cd.yml)</text><text x="58" y="686" font-size="15.5" fill="#5B6B7F">el estado deseado vive en deploy/entornos/ y solo cambia por pull request</text><rect x="60" y="715" width="260" height="104" rx="9" fill="#fff" stroke="#B7791F" stroke-width="2"/><text x="190.0" y="742" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">PR automático</text><text x="190.0" y="765" font-size="15" fill="#5B6B7F" text-anchor="middle">release de staging</text><text x="190.0" y="786" font-size="15" fill="#5B6B7F" text-anchor="middle">imagen + versiones</text><rect x="344" y="715" width="260" height="104" rx="9" fill="#fff" stroke="#B7791F" stroke-width="2"/><text x="474.0" y="742" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">Merge</text><text x="474.0" y="765" font-size="15" fill="#5B6B7F" text-anchor="middle">revisión humana</text><polyline points="320,767 344,767" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="628" y="715" width="260" height="104" rx="9" fill="#fff" stroke="#B7791F" stroke-width="2"/><text x="758.0" y="742" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">Reconciliador</text><text x="758.0" y="765" font-size="15" fill="#5B6B7F" text-anchor="middle">aplica estado deseado</text><text x="758.0" y="786" font-size="15" fill="#5B6B7F" text-anchor="middle">Cloud Run o simulado</text><polyline points="604,767 628,767" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="912" y="715" width="260" height="104" rx="9" fill="#fff" stroke="#B7791F" stroke-width="2"/><text x="1042.0" y="742" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">Análisis canary</text><text x="1042.0" y="765" font-size="15" fill="#5B6B7F" text-anchor="middle">10% → 50% → 100%</text><text x="1042.0" y="786" font-size="15" fill="#5B6B7F" text-anchor="middle">error, p95, costo</text><polyline points="888,767 912,767" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="1196" y="715" width="260" height="104" rx="9" fill="#fff" stroke="#B7791F" stroke-width="2"/><text x="1326.0" y="742" font-size="17.5" font-weight="700" fill="#1B2A41" text-anchor="middle">PR a producción</text><text x="1326.0" y="765" font-size="15" fill="#5B6B7F" text-anchor="middle">aprobación del</text><text x="1326.0" y="786" font-size="15" fill="#5B6B7F" text-anchor="middle">dueño y Seguridad</text><polyline points="1172,767 1196,767" fill="none" stroke="#1B2A41" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pt)"/><rect x="60" y="860" width="690" height="240" rx="9" fill="#fff" stroke="#1E8E5A" stroke-width="2"/><text x="74" y="887" font-size="17.5" font-weight="700" fill="#1B2A41">Promoción</text><text x="74" y="910" font-size="15" fill="#5B6B7F">Canary aprobado en cada paso: commit &#x27;avanzar al 50%&#x27; y &#x27;100%&#x27;.</text><text x="74" y="931" font-size="15" fill="#5B6B7F">Al final: promover.py mueve el alias &#x27;campeon&#x27;</text><text x="74" y="952" font-size="15" fill="#5B6B7F">en MLflow y actualiza campeon.json.</text><text x="74" y="973" font-size="15" fill="#5B6B7F">Producción: r-2-0 → r-3-1-0 sin errores;</text><text x="74" y="994" font-size="15" fill="#5B6B7F">costo por tarea $0.0149 → $0.0040.</text><rect x="780" y="860" width="690" height="240" rx="9" fill="#fff" stroke="#C0392B" stroke-width="2"/><text x="794" y="887" font-size="17.5" font-weight="700" fill="#1B2A41">Rollback automático</text><text x="794" y="910" font-size="15" fill="#5B6B7F">Si el canary incumple un criterio, el mismo ciclo</text><text x="794" y="931" font-size="15" fill="#5B6B7F">regresa el 100% del tráfico a la revisión estable.</text><text x="794" y="952" font-size="15" fill="#5B6B7F">Prueba: r-3-1-1 con 15% de errores inyectados</text><text x="794" y="973" font-size="15" fill="#5B6B7F">→ tasa de error 0.28 → rollback al 10%.</text><text x="794" y="994" font-size="15" fill="#5B6B7F">Todo queda en gitops/historial.md y la bitácora.</text><rect x="1540" y="630" width="820" height="500" rx="16" fill="#F4F6F8" stroke="#5B6B7F" stroke-width="2.2"/><text x="1558" y="662" font-size="21" font-weight="700" fill="#5B6B7F">5 · Operación continua</text><text x="1558" y="686" font-size="15.5" fill="#5B6B7F">monitoreo, auditoría y mejora</text><rect x="1560" y="705" width="780" height="90" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="1574" y="732" font-size="17.5" font-weight="700" fill="#1B2A41">/metrics (Prometheus) + alertas</text><text x="1574" y="755" font-size="15" fill="#5B6B7F">SLO, costo por tarea, mezcla del router,</text><text x="1574" y="776" font-size="15" fill="#5B6B7F">deriva de idioma, sombra, PII</text><rect x="1560" y="809" width="780" height="90" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="1574" y="836" font-size="17.5" font-weight="700" fill="#1B2A41">Bitácora encadenada SHA-256</text><text x="1574" y="859" font-size="15" fill="#5B6B7F">cada decisión con versiones y ruta;</text><text x="1574" y="880" font-size="15" fill="#5B6B7F">verificación de integridad</text><rect x="1560" y="913" width="780" height="90" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="1574" y="940" font-size="17.5" font-weight="700" fill="#1B2A41">Monitoreo semanal (monitoreo.yml)</text><text x="1574" y="963" font-size="15" fill="#5B6B7F">reevalúa por grupo y abre un issue</text><text x="1574" y="984" font-size="15" fill="#5B6B7F">si un componente sale de compuerta</text><rect x="1560" y="1017" width="780" height="90" rx="9" fill="#fff" stroke="#8A99AD" stroke-width="1.4"/><text x="1574" y="1044" font-size="17.5" font-weight="700" fill="#1B2A41">Acciones de optimización</text><text x="1574" y="1067" font-size="15" fill="#5B6B7F">ADR + PR al release (p. ej. router)</text><text x="1574" y="1088" font-size="15" fill="#5B6B7F">→ vuelve al paso 1</text><polyline points="1950,1130 1950,1165 22,1165 22,350 40,350" fill="none" stroke="#5B6B7F" stroke-width="2.4" stroke-dasharray="7 5" stroke-linejoin="round" marker-end="url(#pgr)"/><text x="980" y="1195" font-size="15" font-weight="400" fill="#5B6B7F" text-anchor="middle">retroalimentación: las acciones de operación vuelven como nuevas versiones de datos, modelos y configuración</text><polyline points="1950,585 1950,630" fill="none" stroke="#6B4FA8" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pmo)"/><polyline points="760,585 760,630" fill="none" stroke="#1E8E5A" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#pve)"/></svg>